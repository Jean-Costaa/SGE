{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">
  <h3 class="display-6">Deletar fornecedor</h3>

  <div class="card">
    <div class="card-body">
      <pc class="cadt-text">Tem certeza que deseja excluir o fornecedor <strong>{{ object.name }}</strong></p>

      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Deletar</button>
      </form>

      <a href="{% url 'supplier_list' %}" class="btn btn-secondary mt-3">Cancelar e voltar para a lista de fornecedores</a>
    </div>
  </div>

</div>

{% endblock %}
